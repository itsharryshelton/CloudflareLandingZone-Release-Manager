# Secret Scanning - credential and token leakage detection for a module repository.
# Called by ci.yml so the release tag is gated on it; also runnable on demand.
#
# Injected by the Cloudflare Landing Zone Release Manager. Module repositories are
# strict mirrors, so an edit made here is reverted on the next release - change
# templates/module in the Release Manager instead.
name: Secret Scanning

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Assembled at runtime by every consumer below so the literal prefix never appears
  # in this file - otherwise the scanners flag their own source as a leak.
  TOKEN_PREFIX_STEM: cfat

jobs:
  secret-scan:
    name: betterleaks & token guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installed from the upstream release rather than a marketplace action, so the
      # only thing executed is a pinned binary whose SHA256 is checked below.
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 1.8.1
          BETTERLEAKS_DIGEST: efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a
        run: |
          set -euo pipefail

          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${tarball}"
          workdir="${RUNNER_TEMP}/betterleaks"
          mkdir -p "$workdir"

          curl --fail --silent --show-error --location --retry 3 \
            --output "${workdir}/${tarball}" "$url"

          echo "${BETTERLEAKS_DIGEST}  ${workdir}/${tarball}" | sha256sum --check --strict -

          tar -xzf "${workdir}/${tarball}" -C "$workdir"
          binary="$(find "$workdir" -type f -name betterleaks -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "::error::betterleaks binary not found in ${tarball}"
            exit 1
          fi

          chmod +x "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          echo "Installed betterleaks ${BETTERLEAKS_VERSION}"

      # Non-zero exit is captured rather than propagated so the report below is always
      # published; the job is failed explicitly once the findings are visible.
      - name: Betterleaks secrets scan
        id: betterleaks
        run: |
          set -euo pipefail

          exit_code=0
          betterleaks git \
            --config .betterleaks.toml \
            --report-format sarif \
            --report-path betterleaks-report.sarif \
            --redact \
            --no-color \
            --no-banner || exit_code=$?

          leak_count=0
          if [[ -f betterleaks-report.sarif ]]; then
            leak_count="$(jq '[.runs[]?.results[]?] | length' betterleaks-report.sarif)"
          elif [[ "$exit_code" -ne 0 ]]; then
            echo "::error::betterleaks exited ${exit_code} without producing a report"
            exit "$exit_code"
          fi

          {
            echo "exit-code=${exit_code}"
            echo "leak-count=${leak_count}"
          } >> "$GITHUB_OUTPUT"

      # Findings land in the run summary so reviewers do not need to download anything.
      - name: Publish findings to job summary
        if: always() && hashFiles('betterleaks-report.sarif') != ''
        run: |
          set -euo pipefail

          count="${{ steps.betterleaks.outputs.leak-count }}"

          {
            echo "## Betterleaks findings: ${count}"
            echo ""
            if [[ "$count" -gt 0 ]]; then
              echo "| File | Line | Rule | Detail (redacted) |"
              echo "| --- | --- | --- | --- |"
              jq -r '
                .runs[]?.results[]?
                | [
                    (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                    (.locations[0].physicalLocation.region.startLine // 0 | tostring),
                    (.ruleId // "unknown"),
                    ((.message.text // "") | gsub("[|[:space:]]+"; " "))
                  ]
                | "| " + join(" | ") + " |"
              ' betterleaks-report.sarif
            else
              echo "No secrets detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Redacted SARIF retained for triage; short retention keeps the blast radius small.
      - name: Upload SARIF report
        if: always() && hashFiles('betterleaks-report.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: betterleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: betterleaks-report.sarif
          retention-days: 7

      - name: Fail on detected leaks
        if: steps.betterleaks.outputs.leak-count != '0'
        run: |
          echo "::error::Betterleaks detected ${{ steps.betterleaks.outputs.leak-count }} secret(s). See the job summary above and the betterleaks-report artefact. Revoke any exposed credentials immediately."
          exit 1

      - name: Strict Cloudflare Token Guard
        env:
          # github.event_name is the caller's event under workflow_call, so the PR
          # diff check below still runs when ci.yml invokes this on a pull request.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Reassembled here so neither this guard nor betterleaks matches this workflow.
          prefix="${TOKEN_PREFIX_STEM}_"
          # Mirrors the cloudflare-api-token-prefix rule in .betterleaks.toml: a bare prefix
          # is prose, so at least one token character must follow before it is a credential.
          pattern="\b${prefix}[A-Za-z0-9_-]+\b"

          echo "Commencing strict Cloudflare API token prefix (${prefix}) scan..."
          detected=0

          scanner_config=".betterleaks.toml"

          # 1. Scan all tracked files in working directory
          tracked_matches="$(git grep -I -n -E -i -e "$pattern" -- . ":!${scanner_config}" || true)"
          if [[ -n "$tracked_matches" ]]; then
            echo "::error::Cloudflare API token prefix '${prefix}' detected in tracked repository files:"
            echo "$tracked_matches"
            detected=1
          fi

          # 2. On a pull request, also scan the lines the PR adds.
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_REF" ]]; then
            git fetch origin "$BASE_REF" --depth=100 --quiet || true
            diff_matches="$(git diff -U0 "origin/${BASE_REF}...HEAD" \
              -- . ":!${scanner_config}" \
              | grep -E -i "^\+[[:space:]]*.*${pattern}" || true)"
            if [[ -n "$diff_matches" ]]; then
              echo "::error::Cloudflare API token prefix '${prefix}' detected in pull request diff additions:"
              echo "$diff_matches"
              detected=1
            fi
          fi

          if [[ "$detected" -ne 0 ]]; then
            echo "::error::Secret scan failed: Cloudflare token prefix '${prefix}' found. Please revoke any exposed tokens immediately."
            exit 1
          fi

          echo "Secret scan passed successfully. No token prefixes identified."
